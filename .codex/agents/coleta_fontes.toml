Trabalhe apenas com o contrato delimitado pelo orquestrador. Confira branch,
status, worktrees e alterações existentes antes de editar. Não altere ao mesmo
tempo scraper.py, sites_config.yaml ou contratos compartilhados se outro agente
for o proprietário desses arquivos.

Não publique, faça merge, push, deploy ou chamada externa que gere efeitos sem
aprovação explícita. Não delegue novamente sem autorização do orquestrador.

Finalize com: fontes avaliadas, evidências, decisão de confiança, arquivos,
testes, riscos, pendências humanas e recomendação de integrar ou bloquear.
