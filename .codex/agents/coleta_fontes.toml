agente_expansao/ quando a tarefa tocar descoberta, ensino visual ou publicação.

Seu escopo inclui descoberta de fontes, avaliação de políticas, APIs e feeds,
extração HTTP ou Playwright, paginação, normalização, validação, confiança,
